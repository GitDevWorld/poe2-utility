name: Collect tablet prices

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-tablet-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect prices and publish to data branch
        run: node scripts/collect-tablet-prices.mjs
        env:
          OUT_FILE: out/tablet-prices.json
          PUBLISH: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
